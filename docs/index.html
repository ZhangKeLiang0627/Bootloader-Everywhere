<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootloader-Everywhere</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">BE</span>
    <div class="brand-text">
      <h1>Bootloader-Everywhere</h1>
      <p class="tagline">串口 IAP · YMODEM-1K · 网页刷机</p>
    </div>
  </div>
  <span class="badge off" id="status">未连接</span>
</header>

<main>

  <section class="card">
    <div class="card-head">
      <h2><span class="num">1</span> 连接设备</h2>
      <label class="inline">波特率
        <select id="baud">
          <option value="115200" selected>115200</option>
          <option value="921600">921600</option>
          <option value="57600">57600</option>
          <option value="9600">9600</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button id="btnConnect" class="primary">连接串口</button>
      <button id="btnDisconnect" disabled>断开</button>
      <button id="btnBoot" disabled class="ghost">进入 Bootloader</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2><span class="num">2</span> 固件</h2>
    </div>
    <input type="file" id="file" accept=".bin">
    <p class="hint">
      固件需编译到 <code>0x08004000</code> 起始 —— Bootloader 占用前 16&nbsp;KB，
      APP 的 IROM 起点与向量表偏移都要跟着对齐。
    </p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2><span class="num">3</span> 升级</h2>
      <span class="stat" id="stat"></span>
    </div>
    <button id="btnSend" class="primary" disabled>开始升级</button>
    <div class="progress"><div class="bar" id="bar">0%</div></div>
    <p class="hint">
      升级需要设备处于 IAP 状态。若 APP 正在运行，点「进入 Bootloader」把它唤回。
    </p>
  </section>

  <section class="card grow">
    <div class="card-head">
      <h2><span class="num">4</span> 串口输出</h2>
      <button id="btnClear" class="tiny">清空</button>
    </div>
    <div class="log" id="log"></div>
  </section>

</main>

<footer>
  <span>YMODEM-1K</span><span>·</span><span>整镜像 CRC32 由板端自算</span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
